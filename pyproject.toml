[project]
name = "ritme"
version = "0.1.0"
description = "Ritme monorepo root (uv workspace for the Python packages)."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["apps/backend", "packages/ai-engine", "packages/contracts"]

[tool.uv.sources]
ritme-contracts = { workspace = true }
ritme-ai-engine = { workspace = true }
ritme-backend = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
  "import-linter>=2.1",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines are tolerated (no formatter enforced yet); B008: FastAPI's `Depends(...)` defaults.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/backend/tests", "packages/ai-engine/tests", "packages/contracts/tests"]

[tool.importlinter]
root_packages = ["app", "ritme_ai", "ritme_contracts"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "contracts imports nothing from the app or engine"
type = "forbidden"
source_modules = ["ritme_contracts"]
forbidden_modules = ["app", "ritme_ai"]

[[tool.importlinter.contracts]]
name = "ai-engine never imports the backend (no DB, no HTTP framework)"
type = "forbidden"
source_modules = ["ritme_ai"]
forbidden_modules = ["app", "sqlalchemy", "fastapi", "psycopg"]

# "LLM SDK only inside ritme_ai/llm" is enforced by apps/backend/tests/test_boundaries.py
# (import-linter cannot forbid a sub-package of the external `google` namespace).
