[alembic]
script_location = alembic
prepend_sys_path = .
# URL comes from app settings (DATABASE_URL / Cloud SQL vars) in alembic/env.py; never hard-code it here.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
