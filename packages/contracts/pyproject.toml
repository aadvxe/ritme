[project]
name = "ritme-contracts"
version = "0.1.0"
description = "Ritme shared contracts: Pydantic models for extraction, plan, preferences and API DTOs. Single source of truth."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ritme_contracts"]
